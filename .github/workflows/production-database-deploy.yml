name: Production Database Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to confirm production database schema deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deployment request
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirmation != 'DEPLOY' }}
        run: |
          echo "Production database deployment was not confirmed."
          echo "Run the workflow again and type DEPLOY exactly."
          exit 1

  deploy:
    name: Push Prisma schema to production
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL || secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify production database secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PRODUCTION_DATABASE_URL is not configured."
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "DIRECT_URL could not be resolved."
            exit 1
          fi
          echo "Production database connection variables are configured."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Show Prisma schema status
        run: |
          echo "Repository currently uses Prisma db push rather than a migrations directory."
          echo "Applying the checked-in main branch schema to the configured production database."

      - name: Deploy schema
        run: npx prisma db push

      - name: Verify schema is synchronized
        run: npx prisma db push

      - name: Deployment summary
        run: |
          echo "## Production Database Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prisma schema validated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production schema synchronized" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow intentionally uses prisma db push until the existing production database is baselined for Prisma Migrate." >> "$GITHUB_STEP_SUMMARY"
