name: Production Database Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to confirm production database schema deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deployment request
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirmation != 'DEPLOY' }}
        run: |
          echo "Production database deployment was not confirmed."
          echo "Run the workflow again and type DEPLOY exactly."
          exit 1

  deploy:
    name: Apply additive Grants schema to production
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL || secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify production database secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PRODUCTION_DATABASE_URL is not configured."
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "DIRECT_URL could not be resolved."
            exit 1
          fi
          echo "Production database connection variables are configured."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Explain deployment mode
        run: |
          echo "Using a targeted additive SQL deployment."
          echo "This workflow will NOT run prisma db push and will NOT drop unmanaged production tables."
          echo "Protected existing tables include internal_orders and internal_customer_lifecycle."

      - name: Apply Grants and Allocations schema
        run: npx prisma db execute --file scripts/production/grants-allocations-additive.sql --url "$DIRECT_URL"

      - name: Verify Grants tables with Prisma Client
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const [rounds, grantees, applications, requests, evaluations, allocations] = await Promise.all([
              prisma.fundingRound.count(),
              prisma.grantee.count(),
              prisma.granteeApplication.count(),
              prisma.applicationCategoryRequest.count(),
              prisma.evaluation.count(),
              prisma.allocation.count(),
            ]);
            console.log('Grants schema verified:', { rounds, grantees, applications, requests, evaluations, allocations });
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          }).finally(async () => {
            await prisma.$disconnect();
          });
          NODE

      - name: Deployment summary
        run: |
          echo "## Production Database Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prisma schema validated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Grants & Allocations schema applied additively" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing unmanaged production tables preserved" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prisma Client verified all six Grants/Allocations tables" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This targeted workflow is temporary until the production database is baselined for Prisma Migrate." >> "$GITHUB_STEP_SUMMARY"
